<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saborê - Sua página de receitas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="shortcut icon" href="assets/icons/favicon_io (2)/favicon-32x32.png" type="image/x-icon">
</head>

<body>
    <nav>
        <div class="nav-bar">
            <img class="img-logo" src="assets/icons/favicon_io (2)/android-chrome-192x192.png" alt="logo">
            <a href="index.html">Saborê</a>
        </div>
    </nav>
    <section class="login-background">
        <div class="login-box">
            <label for="new-user">Novo usuário</label>
            <input class="input-login" id="new-user" type="text" placeholder="Usuário">
            <label for="new-passwd">Senha</label>
            <input class="input-login" id="new-passwd" type="password" placeholder="Senha">
            <label for="confirm-passwd">Confirme a sua senha</label>
            <input class="input-login" id="confirm-passwd" type="password" placeholder="Confirme a senha">
            <button type="submit" class="btn-entrar">Cadastrar-se</button>
            <hr class="divider" />
            <p class="footer-text">
                Já tem uma conta? <a href="login.html">Entre</a>
            </p>
        </div>
    </section>
</body>

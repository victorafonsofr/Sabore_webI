<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saborê - Receita</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/app.css">
    <link rel="shortcut icon" href="/assets/icons/favicon_io (2)/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <nav>
        <div class="nav-bar">
            <a href="/index.html"><img class="img-logo" src="/assets/icons/favicon_io (2)/android-chrome-192x192.png" alt="Logo Saborê"></a>
            <a href="/index.html">Início</a>
            <a href="/index.html#receitas">Receitas principais</a>
            <a href="/favoritos.html">Receitas favoritadas</a>
            <a href="/index.html#sobre">Sobre o Saborê</a>
            <div class="dropdown-user">
                <a href="/login.html" class="dropdown-btn" aria-label="Entrar ou cadastrar"><img class="pesquisar-img" src="/assets/icons/icone-perfil.png" alt="Perfil"></a>
                <div class="dropdown-content-user"><a href="/login.html">Entrar</a><a href="/cadastro.html">Cadastrar</a></div>
            </div>
        </div>
    </nav>

    <main class="main-colorida">
        <article class="receita" id="detalhe-receita">
            <a class="receita-voltar" href="/index.html#receitas">← Voltar para receitas</a>
            <p id="estado-receita" class="estado-carregamento" role="status" aria-live="polite">Carregando receita...</p>
            <img class="foto-receita" id="receita-imagem" src="/assets/img/AdobeStock_115079322-scaled.webp" alt="">
            <header class="receita-cabecalho">
                <h1 class="titulo-centralizado" id="receita-titulo"></h1>
                <p id="receita-descricao"></p>
                <ul class="receita-info" id="receita-info"></ul>
            </header>

            <section class="receita-bloco receita-ingredientes">
                <h2>Ingredientes</h2>
                <ul class="lista-ingredientes" id="receita-ingredientes"></ul>
            </section>

            <section class="receita-bloco">
                <h2>Modo de preparo</h2>
                <ol class="passos" id="receita-passos"></ol>
            </section>

            <section class="comentarios" id="comentarios">
                <h2>Comentários</h2>
                <form class="form-comentario" id="form-comentario">
                    <label for="conteudo-comentario">Deixe seu comentário (é necessário entrar na conta):</label>
                    <textarea id="conteudo-comentario" maxlength="500" required placeholder="Compartilhe sua experiência com a receita..."></textarea>
                    <p class="form-mensagem" id="mensagem-comentario" role="alert" aria-live="polite"></p>
                    <button type="submit">Publicar comentário</button>
                </form>
                <div id="lista-comentarios"></div>
            </section>
        </article>
    </main>
    <script src="/scripts/app.js" defer></script>
</body>
</html>
